[project]
name = "autoaudit"
version = "0.1.0"
description = "AutoAudit - Intelligent Contract Review, Policy RAG, Risk Engine & Redlining System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.23.26",
    "python-docx>=1.1.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
]
ml = [
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
